name: CI

# Checks obrigatorios para branch protection em main (configurar no GitHub):
# lint, typecheck, test, build, format, dependency-scan, secret-scan, migrate,
# commitlint (so em pull_request).
#
# CI DESATIVADO enquanto billing do GitHub estiver locked — reativar removendo
# este guard quando resolver. A conta esta com billing lock; todo job falha em
# ~5-13s com "The job was not started because your account is locked due to a
# billing issue", antes de qualquer step rodar (nao e teste vermelho, e o
# workflow nem iniciando). Branch protection ja esta desligada (repo solo) e o
# gate real virou suite local + auditoria manual do diff (ver politica de merge
# em CLAUDE.md). Reativar: apagar o bloco `on: {}` abaixo e descomentar o
# original.
on: {}
# on:
#   pull_request:
#     branches: [main]
#   push:
#     branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run ${{ matrix.task }}

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  contract:
    name: contract
    runs-on: ubuntu-latest
    # O OpenAPI (/docs) e DERIVADO dos schemas Zod das rotas (D-032). Este job
    # reprova quando o contrato versionado (packages/contracts/openapi.json)
    # DESSINCRONIZA da implementacao: regenera o spec do codigo e compara.
    #
    # NAO passa por vacuidade: o arquivo commitado e GERADO (nao escrito a mao) e
    # esta prettier-ignored, e o passo abaixo o reconstroi das ROTAS VIVAS e faz
    # diff byte a byte. Um schema mudado sem regenerar deixa o diff != 0 e o job
    # VERMELHO. (A divergencia OpenAPI-vs-validacao ja e IMPOSSIVEL por construcao
    # — o mesmo schema Zod valida E documenta; este job pega o outro caso: o
    # artefato versionado ficar para tras.)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # gen:openapi importa @fitvo/database — precisa do client Prisma gerado.
      - name: Gera o client Prisma
        run: pnpm --filter @fitvo/database build
      - name: Regenera o OpenAPI dos schemas Zod
        run: pnpm --filter @fitvo/api gen:openapi
      - name: Contrato versionado bate com a implementacao (sem drift)
        run: git diff --exit-code -- packages/contracts/openapi.json

  migrate:
    name: migrate
    runs-on: ubuntu-latest
    # Os demais jobs NAO tocam banco: provam que o codigo compila e passa nos
    # testes, nao que a MIGRACAO aplica. Sem este job o CI fica verde com a
    # cadeia de migracoes quebrada, e o erro so aparece no deploy — ou no
    # primeiro `pnpm db:migrate` de quem clonou o repo.
    services:
      postgres:
        # Porta 5432 aqui de proposito: o runner e limpo. O 5434 do
        # docker-compose e contorno para o Postgres NATIVO da maquina local
        # (ver docs/troubleshooting.md) — colisao que nao existe no CI.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitvo
          POSTGRES_PASSWORD: fitvo
          POSTGRES_DB: fitvo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fitvo:fitvo@localhost:5432/fitvo?schema=public
      SHADOW_DATABASE_URL: postgresql://fitvo:fitvo@localhost:5432/fitvo_shadow?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # 1) A cadeia inteira aplica num banco VAZIO — o que o deploy e o dev
      #    novo fazem. `migrate deploy` nao cria migracao: so aplica as
      #    existentes, entao falha se alguma estiver quebrada ou fora de ordem.
      - name: Migracoes aplicam do zero
        run: pnpm --filter @fitvo/database exec prisma migrate deploy

      # 2) DRIFT: schema.prisma bate com as migracoes? Pega o caso classico de
      #    editar o schema e esquecer de gerar a migracao — que passa em lint,
      #    typecheck, test e build, e so quebra no deploy. --exit-code faz o
      #    comando sair !=0 quando ha diferenca.
      # URL sem `?schema=public`: esse parametro e do Prisma, e o psql rejeita
      # ("invalid URI query parameter"). O shadow precisa ser OUTRO banco — o
      # Prisma o usa como rascunho e o reinicia.
      - name: Cria banco de shadow para o diff
        run: psql "postgresql://fitvo:fitvo@localhost:5432/fitvo" -c 'CREATE DATABASE fitvo_shadow;'
      - name: Sem drift entre schema.prisma e as migracoes
        run: |
          pnpm --filter @fitvo/database exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      # 3) TESTES DE INTEGRACAO — rodam AQUI, e nao no job `test`, porque exigem
      #    banco: este job ja subiu o Postgres e ja aplicou a cadeia acima. O
      #    banco esta no estado exato de que eles precisam; subir outro container
      #    seria duplicar infra.
      #
      #    Eles cobrem o que o resto do CI NAO consegue ver:
      #    - MAPEAMENTO: os testes do slice usam repositorio in-memory. Campo
      #      errado, relacao trocada ou onDelete frouxo passam verdes lá.
      #    - A constraint EXCLUDE da agenda: e SQL cru, invisivel ao drift check
      #      dos dois lados. Se alguem a derrubar, o passo (2) acima NAO percebe —
      #      quem percebe e este.
      - name: Testes de integracao (mapeamento + constraints)
        run: pnpm test:integration

  commitlint:
    name: commitlint
    # Gate server-side do Conventional Commits. O hook husky commit-msg roda o
    # MESMO commitlint localmente, mas some com `git commit --no-verify` — este
    # job e o que garante. Reprova: tipo ausente/fora do enum (feat|fix|...),
    # escopo/formato invalido, assunto vazio. Config em commitlint.config.cjs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # 1) Cada commit do PR. Se o merge for por squash o titulo prevalece
      #    (passo 2), mas commits limpos mantem o historico da branch legivel.
      - name: Lint dos commits do PR
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
      # 2) O TITULO do PR — no squash-merge ele VIRA o commit na main. Passado
      #    por env (nao interpolado no shell) para evitar injecao.
      - name: Lint do titulo do PR (vira o commit no squash)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint --verbose

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    # osv-scanner le o pnpm-lock.yaml direto (base OSV). Evita o endpoint de
    # audit legado do npm, que foi aposentado (410) e quebra o `pnpm audit`.
    steps:
      - uses: actions/checkout@v7
      - name: Install osv-scanner
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
      - name: Scan dependencies (OSV)
        run: ./osv-scanner scan --lockfile=pnpm-lock.yaml

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # Roda o gitleaks CLI sobre o historico completo. A gitleaks-action tenta
    # diferenciar <root>^..HEAD e falha no primeiro push (root nao tem pai).
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan for secrets (full history)
        run: ./gitleaks detect --source . --redact -v --config .gitleaks.toml
