title = "FITVO gitleaks config"

# Usa o conjunto de regras padrao do gitleaks como base.
[extend]
useDefault = true

[allowlist]
description = "Placeholders de .env.example nao sao segredos reais"
paths = [
  '''(^|/)\.env\.example$''',
  '''.*\.env\.example$''',
]
regexes = [
  '''(?i)change[-_]?me''',
  '''(?i)your[-_].*[-_]here''',
  '''(?i)placeholder''',
  '''USER:PASSWORD''',
  # Fixtures de teste (senhas e segredos falsos em *.test.ts) — nao sao reais.
  '''senha-[a-z0-9-]+''',
  '''(access|refresh)-secret-[a-z0-9-]+''',
  '''secret-de-teste[a-z0-9-]*''',
  '''test-(access|refresh)-secret[a-z0-9-]*''',
]
